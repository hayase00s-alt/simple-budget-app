<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="家計簿" />
  <meta name="theme-color" content="#f8fafc" />
  <title>家計簿アプリ</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
    }
    .shell { max-width: 560px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .badge { width: 48px; height: 48px; border-radius: 18px; background: #fff; box-shadow: 0 1px 4px rgba(15,23,42,.08); display:flex; align-items:center; justify-content:center; font-size:24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
    .subtitle { margin: 3px 0 0; color:#64748b; font-size:13px; }
    .tabs { display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; background:#e2e8f0; padding:4px; border-radius:18px; margin-bottom:16px; }
    .tab-btn { border:0; border-radius:14px; padding:10px 6px; font-size:13px; font-weight:700; background:transparent; color:#475569; cursor:pointer; }
    .tab-btn.active { background:#fff; color:#0f172a; box-shadow:0 1px 3px rgba(15,23,42,.1); }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 1px 4px rgba(15,23,42,.06); overflow:hidden; }
    .card-header { padding:18px 18px 8px; }
    .card-title { margin:0; font-size:20px; font-weight:800; }
    .card-content { padding:18px; }
    .stack { display:flex; flex-direction:column; gap:12px; }
    .budget-row { display:flex; justify-content:space-between; align-items:center; gap:12px; border:1px solid #e2e8f0; background:#fff; border-radius:18px; padding:12px 14px; }
    .budget-row.low { border-color:#fecaca; background:#fef2f2; }
    .cat-name { font-weight:700; font-size:15px; }
    .small { color:#64748b; font-size:12px; margin-top:4px; line-height:1.35; }
    .amount-block { text-align:right; white-space:nowrap; }
    .amount-main { font-weight:800; font-size:18px; }
    .amount-sub { font-size:12px; color:#64748b; margin-top:2px; }
    .red { color:#dc2626 !important; }
    .total-row { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#0f172a; color:#fff; border-radius:18px; padding:14px 16px; margin-top:4px; }
    .total-label { font-size:18px; font-weight:800; }
    .total-main { font-size:24px; font-weight:900; }
    .total-sub { font-size:12px; color:#cbd5e1; margin-top:2px; }
    .form-group { display:flex; flex-direction:column; gap:7px; }
    label { font-size:13px; font-weight:700; color:#334155; }
    input, select { height:48px; border-radius:16px; border:1px solid #cbd5e1; padding:0 14px; font-size:16px; background:#fff; color:#0f172a; width:100%; }
    .primary-btn { height:48px; border-radius:16px; border:1px solid #0f172a; background:#0f172a; color:#fff; font-size:16px; font-weight:800; width:100%; cursor:pointer; }
    .outline-btn { min-height:44px; border-radius:16px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; font-size:14px; font-weight:800; padding:0 14px; cursor:pointer; }
    .danger-btn { min-height:44px; border-radius:16px; border:1px solid #dc2626; background:#dc2626; color:#fff; font-size:14px; font-weight:800; padding:0 14px; cursor:pointer; }
    .grid2 { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px; }
    .filters { display:grid; grid-template-columns:1fr; gap:10px; }
    .stat-card { border:1px solid #e2e8f0; background:#f8fafc; border-radius:18px; padding:14px; }
    .stat-label { color:#64748b; font-size:12px; }
    .stat-value { margin-top:4px; font-size:20px; font-weight:900; }
    .list-box { border:1px solid #e2e8f0; background:#fff; border-radius:18px; padding:14px; font-size:13px; color:#475569; }
    .expense-item { display:flex; justify-content:space-between; gap:10px; align-items:center; border:1px solid #e2e8f0; border-radius:14px; padding:10px 12px; margin-top:8px; }
    .expense-name { color:#0f172a; font-weight:800; }
    .edit-form { display:flex; flex-direction:column; gap:8px; width:100%; }
    .two-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .note { color:#64748b; font-size:13px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="badge">💰</div>
      <div>
        <h1>家計簿アプリ</h1>
        <p class="subtitle">カテゴリ予算の残りがすぐわかるシンプル版</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="home">トップ</button>
      <button class="tab-btn" data-tab="input">入力</button>
      <button class="tab-btn" data-tab="list">一覧</button>
      <button class="tab-btn" data-tab="budget">予算設定</button>
    </div>

    <main id="app"></main>
  </div>

  <script>
    const DEFAULT_BUDGETS = {
      "食費＋日用品": 60000,
      "嗜好品": 18000,
      "交際費": 20000,
      "趣味": 38000,
      "外食": 31000,
      "交通費": 12000,
      "勉強費": 25000,
      "その他": 15000,
    };
    const CATEGORIES = Object.keys(DEFAULT_BUDGETS);
    const STORAGE_KEY = "simple-budget-ios-app-standalone-v1";
    const LOW_BUDGET_THRESHOLD = 5000;

    let state = {
      activeTab: "home",
      budgets: { ...DEFAULT_BUDGETS },
      expenses: [],
      extraIncome: 0,
      categoryFilter: "all",
      paymentFilter: "all",
      dateSort: "desc",
      isConfirmingBudgetReset: false,
      isConfirmingListReset: false,
      editingExpenseId: null,
      editExpenseForm: null,
    };

    const app = document.getElementById("app");

    function formatYen(value) {
      return new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 }).format(Math.round(Number(value) || 0));
    }
    function formatManYen(value) { return `${(Math.round(Number(value) || 0) / 10000).toFixed(1)}万`; }
    function sumValues(obj) { return Object.values(obj).reduce((sum, value) => sum + (Number(value) || 0), 0); }
    function normalizeBudgetValue(value) { return Math.max(0, Math.round(Number(value) || 0)); }
    function todayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }
    function normalizeBudgets(savedBudgets) {
      const normalized = { ...DEFAULT_BUDGETS };
      if (!savedBudgets || typeof savedBudgets !== "object") return normalized;
      CATEGORIES.forEach((cat) => {
        if (typeof savedBudgets[cat] === "number" && Number.isFinite(savedBudgets[cat])) normalized[cat] = normalizeBudgetValue(savedBudgets[cat]);
      });
      return normalized;
    }
    function normalizeExpenses(items) {
      if (!Array.isArray(items)) return [];
      return items.filter((item) => item && typeof item === "object" && CATEGORIES.includes(item.category)).map((item, index) => ({
        id: typeof item.id === "string" && item.id ? item.id : `expense-${index}`,
        amount: normalizeBudgetValue(item.amount),
        category: item.category,
        paymentMethod: item.paymentMethod === "クレジット" ? "クレジット" : "現金",
        name: typeof item.name === "string" && item.name.trim() ? item.name.trim() : "名称未設定",
        date: typeof item.date === "string" && item.date ? item.date : todayString(),
        createdAt: Number.isFinite(Number(item.createdAt)) ? Number(item.createdAt) : Date.now() + index,
      })).filter((item) => item.amount > 0);
    }
    function getFoodGuideStatus(monthBudget) {
      const now = new Date();
      const budget = normalizeBudgetValue(monthBudget);
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const weeksInMonth = Math.max(1, Math.ceil(daysInMonth / 7));
      const weeklyBudget = budget / weeksInMonth;
      const elapsedWeeks = Math.min(weeksInMonth, Math.max(1, Math.ceil(now.getDate() / 7)));
      const expectedSpent = Math.min(budget, weeklyBudget * elapsedWeeks);
      return { weeksInMonth, weeklyBudget: Math.round(weeklyBudget), expectedRemaining: Math.max(0, Math.round(budget - expectedSpent)) };
    }
    function buildRemainingByCategory() {
      const remaining = { ...state.budgets };
      state.expenses.forEach((expense) => { if (typeof remaining[expense.category] === "number") remaining[expense.category] -= expense.amount; });
      return remaining;
    }
    function buildUsedByCategory() {
      const used = {};
      CATEGORIES.forEach((cat) => used[cat] = 0);
      state.expenses.forEach((expense) => { if (typeof used[expense.category] === "number") used[expense.category] += expense.amount; });
      return used;
    }
    function filteredExpenses() {
      let items = state.expenses.slice();
      if (state.categoryFilter !== "all") items = items.filter((item) => item.category === state.categoryFilter);
      if (state.paymentFilter !== "all") items = items.filter((item) => item.paymentMethod === state.paymentFilter);
      items.sort((a, b) => {
        const result = a.date.localeCompare(b.date) || a.createdAt - b.createdAt;
        return state.dateSort === "asc" ? result : -result;
      });
      return items;
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ budgets: state.budgets, expenses: state.expenses, extraIncome: state.extraIncome }));
    }
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved) return;
        state.budgets = normalizeBudgets(saved.budgets);
        state.expenses = normalizeExpenses(saved.expenses);
        state.extraIncome = normalizeBudgetValue(saved.extraIncome);
      } catch (e) { console.error(e); }
    }
    function setTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
      render();
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[ch]));
    }
    function optionHtml(options, selected) {
      return options.map(([value, label]) => `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
    }

    function renderHome() {
      const remaining = buildRemainingByCategory();
      const used = buildUsedByCategory();
      const totalRemaining = sumValues(remaining) + normalizeBudgetValue(state.extraIncome);
      const food = getFoodGuideStatus(state.budgets["食費＋日用品"] || 0);
      return `<section class="card"><div class="card-header"><h2 class="card-title">今月の予算残り</h2></div><div class="card-content stack">
        ${CATEGORIES.map(cat => {
          const rem = remaining[cat] || 0;
          const low = rem <= LOW_BUDGET_THRESHOLD;
          return `<div class="budget-row ${low ? "low" : ""}"><div><div class="cat-name">${escapeHtml(cat)}</div><div class="small">使用額: ${formatYen(used[cat] || 0)}</div>${cat === "食費＋日用品" ? `<div class="small">今月は${food.weeksInMonth}週換算・週あたり目安 ${formatYen(food.weeklyBudget)} ／ 現時点の目安残額 ${formatYen(food.expectedRemaining)}</div>` : ""}</div><div class="amount-block"><div class="amount-main ${low ? "red" : ""}">${formatManYen(rem)}</div><div class="amount-sub ${low ? "red" : ""}">${formatYen(rem)}</div></div></div>`;
        }).join("")}
        <div class="total-row"><span class="total-label">合計</span><div class="amount-block"><div class="total-main">${formatManYen(totalRemaining)}</div><div class="total-sub">${formatYen(totalRemaining)}</div></div></div>
      </div></section>`;
    }
    function renderInput() {
      return `<section class="card"><div class="card-header"><h2 class="card-title">✍️ 支出を入力</h2></div><div class="card-content"><form id="expense-form" class="stack">
        <div class="form-group"><label for="amount">金額</label><input id="amount" inputmode="numeric" placeholder="例: 1200" /></div>
        <div class="form-group"><label for="category">カテゴリ</label><select id="category">${optionHtml(CATEGORIES.map(c => [c,c]), CATEGORIES[0])}</select></div>
        <div class="form-group"><label for="paymentMethod">支払い方法</label><select id="paymentMethod">${optionHtml([["現金","現金"],["クレジット","クレジット"]], "現金")}</select></div>
        <div class="form-group"><label for="name">名称</label><input id="name" placeholder="例: スーパー、映画、飲み会" /></div>
        <div class="form-group"><label for="date">日付</label><input id="date" type="date" value="${todayString()}" /></div>
        <button class="primary-btn" type="submit">登録する</button>
      </form></div></section>`;
    }
    function renderList() {
      const items = filteredExpenses();
      const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);
      const totalCredit = state.expenses.filter(item => item.paymentMethod === "クレジット").reduce((sum, item) => sum + item.amount, 0);
      return `<section class="card"><div class="card-header"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><h2 class="card-title">📋 一覧・集計</h2>${state.isConfirmingListReset ? `<div style="display:flex;gap:8px;"><button class="danger-btn" id="confirm-list-reset">本当にリセット</button><button class="outline-btn" id="cancel-list-reset">キャンセル</button></div>` : `<button class="outline-btn" id="list-reset">一覧だけリセット</button>`}</div></div><div class="card-content stack">
        <div class="grid2"><div class="stat-card"><div class="stat-label">支出総額</div><div class="stat-value">${formatYen(totalSpent)}</div></div><div class="stat-card"><div class="stat-label">クレジット利用総額</div><div class="stat-value">${formatYen(totalCredit)}</div></div></div>
        <div class="filters"><div class="form-group"><label>カテゴリで絞り込み</label><select id="categoryFilter">${optionHtml([["all","すべて"], ...CATEGORIES.map(c => [c,c])], state.categoryFilter)}</select></div><div class="form-group"><label>支払い方法で絞り込み</label><select id="paymentFilter">${optionHtml([["all","すべて"],["現金","現金"],["クレジット","クレジット"]], state.paymentFilter)}</select></div><div class="form-group"><label>日付順</label><select id="dateSort">${optionHtml([["desc","新しい順"],["asc","古い順"]], state.dateSort)}</select></div></div>
        <div class="list-box"><div>絞り込み結果: ${items.length}件</div>${items.length ? items.slice(0,8).map(item => renderExpenseItem(item)).join("") + (items.length > 8 ? `<div class="small">最新8件まで表示</div>` : "") : `<div class="small">条件に一致する支出はありません。</div>`}</div>
      </div></section>`;
    }
    function renderExpenseItem(item) {
      if (state.editingExpenseId === item.id && state.editExpenseForm) {
        const f = state.editExpenseForm;
        return `<div class="expense-item"><div class="edit-form"><input id="editAmount" inputmode="numeric" value="${escapeHtml(f.amount)}" /><select id="editCategory">${optionHtml(CATEGORIES.map(c => [c,c]), f.category)}</select><select id="editPayment">${optionHtml([["現金","現金"],["クレジット","クレジット"]], f.paymentMethod)}</select><input id="editName" value="${escapeHtml(f.name)}" /><input id="editDate" type="date" value="${escapeHtml(f.date)}" /><div class="two-btns"><button class="primary-btn" id="save-edit">保存</button><button class="outline-btn" id="cancel-edit">キャンセル</button></div></div></div>`;
      }
      return `<div class="expense-item"><div><div class="expense-name">${escapeHtml(item.name)}</div><div class="small">${escapeHtml(item.date)} ・ ${escapeHtml(item.category)} ・ ${escapeHtml(item.paymentMethod)}</div></div><div style="text-align:right;"><div style="font-weight:800;color:#0f172a;">${formatYen(item.amount)}</div><button class="outline-btn edit-btn" data-id="${escapeHtml(item.id)}" style="margin-top:6px;min-height:34px;font-size:12px;">編集</button></div></div>`;
    }
    function renderBudget() {
      return `<section class="card"><div class="card-header"><h2 class="card-title">予算設定</h2></div><div class="card-content stack">
        ${CATEGORIES.map(cat => `<div class="form-group"><label for="budget-${escapeHtml(cat)}">${escapeHtml(cat)} <span style="color:#64748b;">（初期値: ${formatManYen(DEFAULT_BUDGETS[cat])}）</span></label><input class="budget-input" data-cat="${escapeHtml(cat)}" id="budget-${escapeHtml(cat)}" type="number" inputmode="numeric" value="${state.budgets[cat]}" /></div>`).join("")}
        <div class="form-group"><label for="extra-income">追加収入</label><input id="extra-income" type="number" inputmode="numeric" value="${normalizeBudgetValue(state.extraIncome)}" /><div class="small">今月だけの追加収入を入力すると、今月の総予算に上乗せされます。</div></div>
        <div class="budget-row" style="background:#f8fafc;"><div><div class="cat-name">今月の総予算</div><div class="small">初期値の合計: ${formatManYen(sumValues(DEFAULT_BUDGETS))}</div></div><div class="amount-block"><div class="amount-main">${formatManYen(sumValues(state.budgets) + normalizeBudgetValue(state.extraIncome))}</div><div class="amount-sub">${formatYen(sumValues(state.budgets) + normalizeBudgetValue(state.extraIncome))}</div></div></div>
        ${state.isConfirmingBudgetReset ? `<div class="two-btns"><button class="danger-btn" id="confirm-budget-reset">本当にリセット</button><button class="outline-btn" id="cancel-budget-reset">キャンセル</button></div>` : `<button class="outline-btn" id="budget-reset">↺ 予算額だけリセット</button>`}
        <div class="note">美容院は別途</div>
      </div></section>`;
    }
    function render() {
      app.innerHTML = state.activeTab === "home" ? renderHome() : state.activeTab === "input" ? renderInput() : state.activeTab === "list" ? renderList() : renderBudget();
      bindEvents();
    }
    function bindEvents() {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.onclick = () => setTab(btn.dataset.tab));
      const form = document.getElementById("expense-form");
      if (form) form.onsubmit = (e) => {
        e.preventDefault();
        const amount = normalizeBudgetValue(document.getElementById("amount").value);
        const name = document.getElementById("name").value.trim();
        if (!amount || !name) return;
        state.expenses.unshift({ id: `expense-${Date.now()}-${Math.random().toString(36).slice(2,8)}`, amount, category: document.getElementById("category").value, paymentMethod: document.getElementById("paymentMethod").value, name, date: document.getElementById("date").value || todayString(), createdAt: Date.now() });
        save();
        render();
      };
      const catFilter = document.getElementById("categoryFilter");
      if (catFilter) catFilter.onchange = e => { state.categoryFilter = e.target.value; render(); };
      const payFilter = document.getElementById("paymentFilter");
      if (payFilter) payFilter.onchange = e => { state.paymentFilter = e.target.value; render(); };
      const dateSort = document.getElementById("dateSort");
      if (dateSort) dateSort.onchange = e => { state.dateSort = e.target.value; render(); };
      document.querySelectorAll(".edit-btn").forEach(btn => btn.onclick = () => {
        const item = state.expenses.find(x => x.id === btn.dataset.id);
        if (!item) return;
        state.editingExpenseId = item.id;
        state.editExpenseForm = { amount: String(item.amount), category: item.category, paymentMethod: item.paymentMethod, name: item.name, date: item.date };
        render();
      });
      const saveEdit = document.getElementById("save-edit");
      if (saveEdit) saveEdit.onclick = () => {
        const amount = normalizeBudgetValue(document.getElementById("editAmount").value);
        const name = document.getElementById("editName").value.trim();
        if (!amount || !name) return;
        state.expenses = state.expenses.map(item => item.id === state.editingExpenseId ? { ...item, amount, category: document.getElementById("editCategory").value, paymentMethod: document.getElementById("editPayment").value, name, date: document.getElementById("editDate").value || todayString() } : item);
        state.editingExpenseId = null;
        state.editExpenseForm = null;
        save(); render();
      };
      const cancelEdit = document.getElementById("cancel-edit");
      if (cancelEdit) cancelEdit.onclick = () => { state.editingExpenseId = null; state.editExpenseForm = null; render(); };
      document.querySelectorAll(".budget-input").forEach(input => input.oninput = e => { state.budgets[e.target.dataset.cat] = normalizeBudgetValue(e.target.value); save(); });
      const extra = document.getElementById("extra-income");
      if (extra) extra.oninput = e => { state.extraIncome = normalizeBudgetValue(e.target.value); save(); };
      const budgetReset = document.getElementById("budget-reset");
      if (budgetReset) budgetReset.onclick = () => { state.isConfirmingBudgetReset = true; render(); };
      const confirmBudget = document.getElementById("confirm-budget-reset");
      if (confirmBudget) confirmBudget.onclick = () => { state.budgets = { ...DEFAULT_BUDGETS }; state.extraIncome = 0; state.isConfirmingBudgetReset = false; save(); render(); };
      const cancelBudget = document.getElementById("cancel-budget-reset");
      if (cancelBudget) cancelBudget.onclick = () => { state.isConfirmingBudgetReset = false; render(); };
      const listReset = document.getElementById("list-reset");
      if (listReset) listReset.onclick = () => { state.isConfirmingListReset = true; render(); };
      const confirmList = document.getElementById("confirm-list-reset");
      if (confirmList) confirmList.onclick = () => { state.expenses = []; state.isConfirmingListReset = false; state.editingExpenseId = null; state.editExpenseForm = null; save(); render(); };
      const cancelList = document.getElementById("cancel-list-reset");
      if (cancelList) cancelList.onclick = () => { state.isConfirmingListReset = false; render(); };
    }
    load();
    render();
  </script>
</body>
</html>

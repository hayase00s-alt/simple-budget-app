<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <title>家計簿アプリ</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --strong: #cbd5e1;
      --dark: #0f172a;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --yellow: #ca8a04;
      --yellow-bg: #fefce8;
      --yellow-border: #fde68a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .shell { max-width: 560px; margin: 0 auto; padding-bottom: 32px; }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .badge {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 18px;
      margin-bottom: 16px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .tab {
      border: 0;
      border-radius: 14px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      color: #475569;
      cursor: pointer;
    }

    .tab.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }

    .card-header { padding: 18px 18px 8px; }
    .card-title { margin: 0; font-size: 20px; font-weight: 800; }
    .card-content { padding: 18px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }

    .budget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 18px;
      padding: 12px 14px;
    }

    .budget-row.low {
      border-color: var(--yellow-border);
      background: var(--yellow-bg);
    }

    .budget-row.negative {
      border-color: var(--red-border);
      background: var(--red-bg);
    }

    .category-name { font-weight: 700; font-size: 15px; }
    .small { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.35; }

    .amount-block { text-align: right; white-space: nowrap; }
    .amount-main { font-weight: 800; font-size: 18px; }
    .amount-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .red { color: var(--red); }
    .yellow { color: var(--yellow); }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--dark);
      color: #ffffff;
      border-radius: 18px;
      padding: 14px 16px;
      margin-top: 4px;
    }

    .total-label { font-size: 18px; font-weight: 800; }
    .total-main { font-size: 24px; font-weight: 900; }
    .total-sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }

    .form-group { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 13px; font-weight: 700; color: #334155; }

    input, select {
      height: 48px;
      border-radius: 16px;
      border: 1px solid var(--strong);
      padding: 0 14px;
      font-size: 16px;
      background: #ffffff;
      color: var(--text);
      width: 100%;
    }

    button { cursor: pointer; }

    .button {
      min-height: 48px;
      border-radius: 16px;
      border: 1px solid var(--dark);
      background: var(--dark);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      width: 100%;
      padding: 0 14px;
    }

    .outline-button {
      min-height: 44px;
      border-radius: 16px;
      border: 1px solid var(--strong);
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      padding: 0 14px;
    }

    .danger-button {
      min-height: 44px;
      border-radius: 16px;
      border: 1px solid var(--red);
      background: var(--red);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      padding: 0 14px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-confirm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .stat-card {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 18px;
      padding: 14px;
    }

    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 4px; font-size: 20px; font-weight: 900; }

    .list-box {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      font-size: 13px;
      color: #475569;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .expense-name { color: var(--text); font-weight: 800; }
    .expense-actions { text-align: right; }

    .mini-button {
      min-height: 34px;
      border-radius: 12px;
      border: 1px solid var(--strong);
      background: #ffffff;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 0 10px;
      cursor: pointer;
      margin-top: 6px;
    }

    .edit-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note { color: var(--muted); font-size: 13px; }

    @media (min-width: 640px) {
      .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .budget-row { align-items: flex-start; }
      .amount-main { font-size: 16px; }
      .tab { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="badge">💰</div>
      <div>
        <h1>家計簿アプリ</h1>
        <p class="subtitle">カテゴリ予算の残りがすぐわかるシンプル版</p>
      </div>
    </header>

    <nav class="tabs" aria-label="タブ">
      <button class="tab active" type="button" data-tab="home">トップ</button>
      <button class="tab" type="button" data-tab="input">入力</button>
      <button class="tab" type="button" data-tab="list">一覧</button>
      <button class="tab" type="button" data-tab="budget">予算設定</button>
    </nav>

    <section id="tab-home" class="panel active"></section>
    <section id="tab-input" class="panel"></section>
    <section id="tab-list" class="panel"></section>
    <section id="tab-budget" class="panel"></section>
  </main>

  <script>
    const DEFAULT_BUDGETS = {
      "食費＋日用品": 60000,
      "嗜好品": 18000,
      "交際費": 20000,
      "趣味": 38000,
      "外食": 31000,
      "交通費": 12000,
      "勉強費": 25000,
      "その他": 15000
    };

    const CATEGORIES = Object.keys(DEFAULT_BUDGETS);
    const STORAGE_KEY = "simple-budget-ios-app-vanilla-v2";
    const LOW_BUDGET_THRESHOLD = 5000;

    let state = {
      activeTab: "home",
      budgets: { ...DEFAULT_BUDGETS },
      expenses: [],
      extraIncome: 0,
      input: {
        amount: "",
        category: CATEGORIES[0],
        paymentMethod: "現金",
        name: "",
        date: todayString()
      },
      filters: {
        category: "all",
        paymentMethod: "all",
        dateSort: "desc"
      },
      editingExpenseId: null,
      editExpenseForm: null,
      confirmingBudgetReset: false,
      confirmingListReset: false
    };

    function getSafeStorage() {
      try {
        const key = "__budget_app_storage_test__";
        window.localStorage.setItem(key, "ok");
        window.localStorage.removeItem(key);
        return window.localStorage;
      } catch (error) {
        const data = {};
        return {
          getItem(key) {
            return Object.prototype.hasOwnProperty.call(data, key) ? data[key] : null;
          },
          setItem(key, value) {
            data[key] = String(value);
          },
          removeItem(key) {
            delete data[key];
          }
        };
      }
    }

    const storage = getSafeStorage();

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatYen(value) {
      const safeValue = Math.round(Number(value) || 0);
      return new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }).format(safeValue);
    }

    function formatManYen(value) {
      const safeValue = Math.round(Number(value) || 0);
      return `${(safeValue / 10000).toFixed(1)}万`;
    }

    function sumValues(obj) {
      return Object.values(obj).reduce((sum, value) => sum + (Number(value) || 0), 0);
    }

    function todayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function normalizeBudgetValue(value) {
      return Math.max(0, Math.round(Number(value) || 0));
    }

    function normalizeBudgets(savedBudgets) {
      const normalized = { ...DEFAULT_BUDGETS };

      if (!savedBudgets || typeof savedBudgets !== "object") {
        return normalized;
      }

      CATEGORIES.forEach((category) => {
        const value = savedBudgets[category];
        if (typeof value === "number" && Number.isFinite(value)) {
          normalized[category] = normalizeBudgetValue(value);
        }
      });

      return normalized;
    }

    function normalizeExtraIncome(value) {
      return normalizeBudgetValue(value);
    }

    function normalizeExpenses(savedExpenses) {
      if (!Array.isArray(savedExpenses)) {
        return [];
      }

      return savedExpenses
        .filter((item) => item && typeof item === "object")
        .filter((item) => CATEGORIES.includes(item.category))
        .map((item, index) => {
          const amount = normalizeBudgetValue(item.amount);
          return {
            id: typeof item.id === "string" && item.id ? item.id : `expense-${index}`,
            amount,
            category: item.category,
            paymentMethod: item.paymentMethod === "クレジット" ? "クレジット" : "現金",
            name: typeof item.name === "string" && item.name.trim() ? item.name.trim() : "名称未設定",
            date: typeof item.date === "string" && item.date ? item.date : todayString(),
            createdAt: Number.isFinite(Number(item.createdAt)) ? Number(item.createdAt) : Date.now() + index
          };
        })
        .filter((item) => item.amount > 0);
    }

    function getFoodGuideStatus(monthBudget, now = new Date()) {
      const safeBudget = normalizeBudgetValue(monthBudget);
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const weeksInMonth = Math.max(1, Math.ceil(daysInMonth / 7));
      const weeklyBudget = safeBudget / weeksInMonth;
      const elapsedWeeks = Math.min(weeksInMonth, Math.max(1, Math.ceil(now.getDate() / 7)));
      const expectedSpent = Math.min(safeBudget, weeklyBudget * elapsedWeeks);

      return {
        weeksInMonth,
        weeklyBudget: Math.round(weeklyBudget),
        elapsedWeeks,
        expectedRemaining: Math.max(0, Math.round(safeBudget - expectedSpent))
      };
    }

    function buildRemainingByCategory(budgets, expenses) {
      const remaining = { ...budgets };

      expenses.forEach((expense) => {
        if (typeof remaining[expense.category] === "number") {
          remaining[expense.category] -= expense.amount;
        }
      });

      return remaining;
    }

    function buildUsedByCategory(expenses) {
      const used = {};
      CATEGORIES.forEach((category) => {
        used[category] = 0;
      });

      expenses.forEach((expense) => {
        if (typeof used[expense.category] === "number") {
          used[expense.category] += expense.amount;
        }
      });

      return used;
    }

    function filterExpenses(expenses) {
      let items = expenses.slice();

      if (state.filters.category !== "all") {
        items = items.filter((item) => item.category === state.filters.category);
      }

      if (state.filters.paymentMethod !== "all") {
        items = items.filter((item) => item.paymentMethod === state.filters.paymentMethod);
      }

      items.sort((a, b) => {
        const byDate = a.date.localeCompare(b.date);
        const byCreated = a.createdAt - b.createdAt;
        const result = byDate || byCreated;
        return state.filters.dateSort === "asc" ? result : -result;
      });

      return items;
    }

    function createExpenseId() {
      try {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
      } catch (error) {
        // Fallback below.
      }

      return `expense-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function saveState() {
      const payload = {
        budgets: normalizeBudgets(state.budgets),
        extraIncome: normalizeExtraIncome(state.extraIncome),
        expenses: normalizeExpenses(state.expenses)
      };
      storage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadState() {
      try {
        const saved = storage.getItem(STORAGE_KEY);
        if (!saved) {
          return;
        }

        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") {
          state.budgets = normalizeBudgets(parsed.budgets);
          state.extraIncome = normalizeExtraIncome(parsed.extraIncome);
          state.expenses = normalizeExpenses(parsed.expenses);
        }
      } catch (error) {
        console.error("Failed to load saved data", error);
      }
    }

    function runSelfTests() {
      const normalizedBudgets = normalizeBudgets({ 光熱費: 99999, その他: 12000, 趣味: -500, 外食: 31000 });
      console.assert(!Object.prototype.hasOwnProperty.call(normalizedBudgets, "光熱費"), "Removed categories should not survive normalization");
      console.assert(normalizedBudgets.その他 === 12000, "Known categories should keep saved values");
      console.assert(normalizedBudgets.趣味 === 0, "Negative saved budget should clamp to 0");

      const normalizedExpenses = normalizeExpenses([
        { category: "外食", amount: 1200, paymentMethod: "クレジット", name: "ランチ", date: "2026-04-01", createdAt: 1, id: "a" },
        { category: "光熱費", amount: 9000, paymentMethod: "現金", name: "旧カテゴリ", date: "2026-04-02", createdAt: 2, id: "b" },
        { category: "趣味", amount: -200, paymentMethod: "現金", name: "不正", date: "2026-04-03", createdAt: 3, id: "c" }
      ]);
      console.assert(normalizedExpenses.length === 1, "Invalid or removed-category expenses should be filtered out");
      console.assert(normalizedExpenses[0].paymentMethod === "クレジット", "Known payment methods should be preserved");

      const guide = getFoodGuideStatus(60000, new Date("2026-04-15T09:00:00"));
      console.assert(guide.weeksInMonth === 5, "April 2026 should be treated as 5 weeks");
      console.assert(guide.weeklyBudget === 12000, "Weekly food budget should be calculated correctly");
      console.assert(guide.expectedRemaining === 36000, "Expected remaining should match elapsed weeks");

      const withExtraIncome = sumValues({ 外食: 10000, 趣味: 5000 }) + normalizeExtraIncome(3000);
      console.assert(withExtraIncome === 18000, "Extra income should be added to monthly total");

      const remaining = buildRemainingByCategory({ 外食: 10000 }, [{ category: "外食", amount: 2500 }]);
      console.assert(remaining.外食 === 7500, "Remaining amount should subtract expenses");

      const used = buildUsedByCategory([{ category: "趣味", amount: 800 }, { category: "趣味", amount: 200 }]);
      console.assert(used.趣味 === 1000, "Used amount should sum by category");

      const originalFilters = { ...state.filters };
      state.filters = { category: "all", paymentMethod: "all", dateSort: "desc" };
      const manyExpenses = Array.from({ length: 12 }, (_, index) => ({
        id: `many-${index}`,
        date: `2026-04-${String(index + 1).padStart(2, "0")}`,
        createdAt: index,
        category: "外食",
        paymentMethod: "現金",
        amount: 100
      }));
      console.assert(filterExpenses(manyExpenses).length === 12, "All matching expenses should remain available after filtering");
      state.filters = originalFilters;
    }

    function optionHtml(options, selectedValue) {
      return options
        .map((option) => {
          const value = typeof option === "string" ? option : option.value;
          const label = typeof option === "string" ? option : option.label;
          return `<option value="${escapeHtml(value)}" ${value === selectedValue ? "selected" : ""}>${escapeHtml(label)}</option>`;
        })
        .join("");
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      state.confirmingBudgetReset = false;
      state.confirmingListReset = false;
      render();
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.activeTab);
      });

      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.remove("active");
      });

      document.getElementById(`tab-${state.activeTab}`).classList.add("active");
    }

    function renderHome() {
      const remainingByCategory = buildRemainingByCategory(state.budgets, state.expenses);
      const usedByCategory = buildUsedByCategory(state.expenses);
      const totalRemaining = sumValues(remainingByCategory) + normalizeExtraIncome(state.extraIncome);
      const foodGuideStatus = getFoodGuideStatus(state.budgets["食費＋日用品"] || 0);

      document.getElementById("tab-home").innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">今月の予算残り</h2>
          </div>
          <div class="card-content stack">
            ${CATEGORIES.map((category) => {
              const remaining = remainingByCategory[category] || 0;
              const isNegative = remaining < 0;
              const isLow = !isNegative && remaining <= LOW_BUDGET_THRESHOLD;
              const rowClass = isNegative ? "negative" : isLow ? "low" : "";
              const amountClass = isNegative ? "red" : isLow ? "yellow" : "";

              return `
                <div class="budget-row ${rowClass}">
                  <div>
                    <div class="category-name">${escapeHtml(category)}</div>
                    <div class="small">使用額: ${formatYen(usedByCategory[category] || 0)}</div>
                    ${
                      category === "食費＋日用品"
                        ? `<div class="small">今月は${foodGuideStatus.weeksInMonth}週換算・週あたり目安 ${formatYen(foodGuideStatus.weeklyBudget)} ／ 現時点の目安残額 ${formatYen(foodGuideStatus.expectedRemaining)}</div>`
                        : ""
                    }
                  </div>
                  <div class="amount-block">
                    <div class="amount-main ${amountClass}">${formatManYen(remaining)}</div>
                    <div class="amount-sub ${amountClass}">${formatYen(remaining)}</div>
                  </div>
                </div>
              `;
            }).join("")}

            <div class="total-row">
              <span class="total-label">合計</span>
              <div class="amount-block">
                <div class="total-main">${formatManYen(totalRemaining)}</div>
                <div class="total-sub">${formatYen(totalRemaining)}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderInput() {
      document.getElementById("tab-input").innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">✍️ 支出を入力</h2>
          </div>
          <div class="card-content">
            <form id="expense-form" class="stack">
              <div class="form-group">
                <label for="amount">金額</label>
                <input id="amount" inputmode="numeric" placeholder="例: 1200" value="${escapeHtml(state.input.amount)}">
              </div>

              <div class="form-group">
                <label for="category">カテゴリ</label>
                <select id="category">${optionHtml(CATEGORIES, state.input.category)}</select>
              </div>

              <div class="form-group">
                <label for="paymentMethod">支払い方法</label>
                <select id="paymentMethod">${optionHtml(["現金", "クレジット"], state.input.paymentMethod)}</select>
              </div>

              <div class="form-group">
                <label for="name">名称</label>
                <input id="name" placeholder="例: スーパー、映画、飲み会" value="${escapeHtml(state.input.name)}">
              </div>

              <div class="form-group">
                <label for="date">日付</label>
                <input id="date" type="date" value="${escapeHtml(state.input.date)}">
              </div>

              <button type="submit" class="button">登録する</button>
            </form>
          </div>
        </div>
      `;

      document.getElementById("amount").addEventListener("input", (event) => {
        state.input.amount = event.target.value.replace(/[^0-9]/g, "");
        event.target.value = state.input.amount;
      });

      document.getElementById("category").addEventListener("change", (event) => {
        state.input.category = event.target.value;
      });

      document.getElementById("paymentMethod").addEventListener("change", (event) => {
        state.input.paymentMethod = event.target.value;
      });

      document.getElementById("name").addEventListener("input", (event) => {
        state.input.name = event.target.value;
      });

      document.getElementById("date").addEventListener("change", (event) => {
        state.input.date = event.target.value;
      });

      document.getElementById("expense-form").addEventListener("submit", (event) => {
        event.preventDefault();

        const numericAmount = Math.round(Number(state.input.amount));
        if (!numericAmount || numericAmount <= 0) return;
        if (!state.input.name.trim()) return;

        const newExpense = {
          id: createExpenseId(),
          amount: numericAmount,
          category: state.input.category,
          paymentMethod: state.input.paymentMethod,
          name: state.input.name.trim(),
          date: state.input.date,
          createdAt: Date.now()
        };

        state.expenses = [newExpense, ...state.expenses];
        state.input = {
          amount: "",
          category: CATEGORIES[0],
          paymentMethod: "現金",
          name: "",
          date: todayString()
        };
        saveState();
        render();
      });
    }

    function renderList() {
      const filteredExpenses = filterExpenses(state.expenses);
      const totalSpent = state.expenses.reduce((sum, item) => sum + item.amount, 0);
      const totalCreditSpent = state.expenses
        .filter((item) => item.paymentMethod === "クレジット")
        .reduce((sum, item) => sum + item.amount, 0);

      document.getElementById("tab-list").innerHTML = `
        <div class="card">
          <div class="card-header">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <h2 class="card-title">📋 一覧・集計</h2>
              ${
                state.confirmingListReset
                  ? `<div style="display:flex; gap:8px;">
                       <button type="button" id="confirm-list-reset" class="danger-button">本当にリセット</button>
                       <button type="button" id="cancel-list-reset" class="outline-button">キャンセル</button>
                     </div>`
                  : `<button type="button" id="ask-list-reset" class="outline-button">一覧だけリセット</button>`
              }
            </div>
          </div>
          <div class="card-content stack">
            <div class="grid-2">
              <div class="stat-card">
                <div class="stat-label">支出総額</div>
                <div class="stat-value">${formatYen(totalSpent)}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">クレジット利用総額</div>
                <div class="stat-value">${formatYen(totalCreditSpent)}</div>
              </div>
            </div>

            <div class="filters stack">
              <div class="form-group">
                <label for="categoryFilter">カテゴリで絞り込み</label>
                <select id="categoryFilter">${optionHtml([{ value: "all", label: "すべて" }, ...CATEGORIES], state.filters.category)}</select>
              </div>

              <div class="form-group">
                <label for="paymentFilter">支払い方法で絞り込み</label>
                <select id="paymentFilter">${optionHtml([
                  { value: "all", label: "すべて" },
                  "現金",
                  "クレジット"
                ], state.filters.paymentMethod)}</select>
              </div>

              <div class="form-group">
                <label for="dateSort">日付順</label>
                <select id="dateSort">${optionHtml([
                  { value: "desc", label: "新しい順" },
                  { value: "asc", label: "古い順" }
                ], state.filters.dateSort)}</select>
              </div>
            </div>

            <div class="list-box">
              <div>絞り込み結果: ${filteredExpenses.length}件</div>
              ${
                filteredExpenses.length > 0
                  ? `<div>${filteredExpenses.map((item) => renderExpenseItem(item)).join("")}</div>`
                  : `<div class="small">条件に一致する支出はありません。</div>`
              }
            </div>
          </div>
        </div>
      `;

      attachListEvents();
    }

    function renderExpenseItem(item) {
      if (state.editingExpenseId === item.id && state.editExpenseForm) {
        return `
          <div class="expense-item">
            <div class="edit-panel">
              <input id="edit-amount" inputmode="numeric" value="${escapeHtml(state.editExpenseForm.amount)}">
              <select id="edit-category">${optionHtml(CATEGORIES, state.editExpenseForm.category)}</select>
              <select id="edit-paymentMethod">${optionHtml(["現金", "クレジット"], state.editExpenseForm.paymentMethod)}</select>
              <input id="edit-name" value="${escapeHtml(state.editExpenseForm.name)}">
              <input id="edit-date" type="date" value="${escapeHtml(state.editExpenseForm.date)}">
              <div class="grid-confirm">
                <button type="button" class="button" data-save-edit-id="${escapeHtml(item.id)}">保存</button>
                <button type="button" class="outline-button" data-cancel-edit-id="${escapeHtml(item.id)}">キャンセル</button>
              </div>
              <button type="button" class="danger-button" data-delete-edit-id="${escapeHtml(item.id)}">この支出を削除</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="expense-item">
          <div>
            <div class="expense-name">${escapeHtml(item.name)}</div>
            <div class="small">${escapeHtml(item.date)} ・ ${escapeHtml(item.category)} ・ ${escapeHtml(item.paymentMethod)}</div>
          </div>
          <div class="expense-actions">
            <div style="font-weight:800; color:#0f172a;">${formatYen(item.amount)}</div>
            <button type="button" class="mini-button" data-edit-id="${escapeHtml(item.id)}">編集</button>
          </div>
        </div>
      `;
    }

    function attachListEvents() {
      const askResetButton = document.getElementById("ask-list-reset");
      if (askResetButton) {
        askResetButton.addEventListener("click", () => {
          state.confirmingListReset = true;
          render();
        });
      }

      const confirmResetButton = document.getElementById("confirm-list-reset");
      if (confirmResetButton) {
        confirmResetButton.addEventListener("click", () => {
          state.expenses = [];
          state.editingExpenseId = null;
          state.editExpenseForm = null;
          state.confirmingListReset = false;
          saveState();
          render();
        });
      }

      const cancelResetButton = document.getElementById("cancel-list-reset");
      if (cancelResetButton) {
        cancelResetButton.addEventListener("click", () => {
          state.confirmingListReset = false;
          render();
        });
      }

      document.getElementById("categoryFilter").addEventListener("change", (event) => {
        state.filters.category = event.target.value;
        render();
      });

      document.getElementById("paymentFilter").addEventListener("change", (event) => {
        state.filters.paymentMethod = event.target.value;
        render();
      });

      document.getElementById("dateSort").addEventListener("change", (event) => {
        state.filters.dateSort = event.target.value;
        render();
      });

      document.querySelectorAll("[data-edit-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const expense = state.expenses.find((item) => item.id === button.dataset.editId);
          if (!expense) return;

          state.editingExpenseId = expense.id;
          state.editExpenseForm = {
            amount: String(expense.amount),
            category: expense.category,
            paymentMethod: expense.paymentMethod,
            name: expense.name,
            date: expense.date
          };
          render();
        });
      });

      document.querySelectorAll("[data-save-edit-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.saveEditId;
          const form = state.editExpenseForm;
          if (!form) return;

          const nextAmount = Math.round(Number(form.amount));
          if (!nextAmount || nextAmount <= 0 || !form.name.trim()) return;

          state.expenses = state.expenses.map((item) => {
            if (item.id !== id) return item;
            return {
              ...item,
              amount: nextAmount,
              category: form.category,
              paymentMethod: form.paymentMethod,
              name: form.name.trim(),
              date: form.date
            };
          });

          state.editingExpenseId = null;
          state.editExpenseForm = null;
          saveState();
          render();
        });
      });

      document.querySelectorAll("[data-cancel-edit-id]").forEach((button) => {
        button.addEventListener("click", () => {
          state.editingExpenseId = null;
          state.editExpenseForm = null;
          render();
        });
      });

      document.querySelectorAll("[data-delete-edit-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.deleteEditId;
          state.expenses = state.expenses.filter((item) => item.id !== id);
          state.editingExpenseId = null;
          state.editExpenseForm = null;
          saveState();
          render();
        });
      });

      const editAmount = document.getElementById("edit-amount");
      if (editAmount) {
        editAmount.addEventListener("input", (event) => {
          state.editExpenseForm.amount = event.target.value.replace(/[^0-9]/g, "");
          event.target.value = state.editExpenseForm.amount;
        });
      }

      const editCategory = document.getElementById("edit-category");
      if (editCategory) {
        editCategory.addEventListener("change", (event) => {
          state.editExpenseForm.category = event.target.value;
        });
      }

      const editPaymentMethod = document.getElementById("edit-paymentMethod");
      if (editPaymentMethod) {
        editPaymentMethod.addEventListener("change", (event) => {
          state.editExpenseForm.paymentMethod = event.target.value;
        });
      }

      const editName = document.getElementById("edit-name");
      if (editName) {
        editName.addEventListener("input", (event) => {
          state.editExpenseForm.name = event.target.value;
        });
      }

      const editDate = document.getElementById("edit-date");
      if (editDate) {
        editDate.addEventListener("change", (event) => {
          state.editExpenseForm.date = event.target.value;
        });
      }
    }

    function renderBudget() {
      const totalBudget = sumValues(state.budgets) + normalizeExtraIncome(state.extraIncome);

      document.getElementById("tab-budget").innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">予算設定</h2>
          </div>
          <div class="card-content stack">
            ${CATEGORIES.map((category) => `
              <div class="form-group">
                <label for="budget-${escapeHtml(category)}">${escapeHtml(category)} <span style="color:#64748b;">（初期値: ${formatManYen(DEFAULT_BUDGETS[category])}）</span></label>
                <input
                  id="budget-${escapeHtml(category)}"
                  data-budget-category="${escapeHtml(category)}"
                  type="number"
                  inputmode="numeric"
                  value="${escapeHtml(state.budgets[category])}"
                >
              </div>
            `).join("")}

            <div class="form-group">
              <label for="extra-income">追加収入</label>
              <input id="extra-income" type="number" inputmode="numeric" value="${escapeHtml(state.extraIncome)}">
              <div class="small">今月だけの追加収入を入力すると、今月の総予算に上乗せされます。</div>
            </div>

            <div class="budget-row" style="background:#f8fafc;">
              <div>
                <div class="category-name">今月の総予算</div>
                <div class="small">初期値の合計: ${formatManYen(sumValues(DEFAULT_BUDGETS))}</div>
              </div>
              <div class="amount-block">
                <div class="amount-main">${formatManYen(totalBudget)}</div>
                <div class="amount-sub">${formatYen(totalBudget)}</div>
              </div>
            </div>

            ${
              state.confirmingBudgetReset
                ? `<div class="grid-confirm">
                    <button type="button" id="confirm-budget-reset" class="danger-button">本当にリセット</button>
                    <button type="button" id="cancel-budget-reset" class="outline-button">キャンセル</button>
                   </div>`
                : `<button type="button" id="ask-budget-reset" class="outline-button">↺ 予算額だけリセット</button>`
            }

            <div class="note">美容院は別途</div>
          </div>
        </div>
      `;

      document.querySelectorAll("[data-budget-category]").forEach((input) => {
        input.addEventListener("input", (event) => {
          const category = event.target.dataset.budgetCategory;
          state.budgets[category] = normalizeBudgetValue(event.target.value);
          saveState();
          renderHome();
          renderBudget();
        });
      });

      document.getElementById("extra-income").addEventListener("input", (event) => {
        state.extraIncome = normalizeExtraIncome(event.target.value);
        saveState();
        renderHome();
        renderBudget();
      });

      const askReset = document.getElementById("ask-budget-reset");
      if (askReset) {
        askReset.addEventListener("click", () => {
          state.confirmingBudgetReset = true;
          renderBudget();
        });
      }

      const confirmReset = document.getElementById("confirm-budget-reset");
      if (confirmReset) {
        confirmReset.addEventListener("click", () => {
          state.budgets = { ...DEFAULT_BUDGETS };
          state.extraIncome = 0;
          state.input.category = CATEGORIES[0];
          state.confirmingBudgetReset = false;
          saveState();
          render();
        });
      }

      const cancelReset = document.getElementById("cancel-budget-reset");
      if (cancelReset) {
        cancelReset.addEventListener("click", () => {
          state.confirmingBudgetReset = false;
          renderBudget();
        });
      }
    }

    function render() {
      renderTabs();
      renderHome();
      renderInput();
      renderList();
      renderBudget();
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveTab(button.dataset.tab);
      });
    });

    loadState();
    runSelfTests();
    render();
  </script>
</body>
</html>
